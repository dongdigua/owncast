# See https://docs.earthly.dev/ci-integration/vendor-specific-guides/gh-actions-integration
# for details.

# This workflow builds the development container image and, on nightly and
# manual runs, standalone install binaries published to object storage.
# Triggers:
#   - Nightly scheduled builds (2 AM UTC)
#   - Manual runs from the Actions tab (workflow_dispatch)
#   - Push/PR to develop with relevant file changes
# Skips:
#   - Documentation-only changes
#   - Web-only changes (web/** without Go changes)
#
# The riscv64 job only runs on a manual workflow_dispatch. It builds a
# linux/riscv64 image with the plain Dockerfile and publishes it to the GHCR
# namespace of whichever repository the workflow runs in, using GITHUB_TOKEN
# instead of the upstream GH_CR_PAT secret, so it works from a fork.

name: Build development container

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Earthfile"
      - "build/**"
      - ".github/workflows/container.yaml"
  pull_request:
    branches:
      - develop
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Earthfile"
      - "build/**"
      - ".github/workflows/container.yaml"

jobs:
  Earthly:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Earthly
        uses: earthly/actions-setup@v1
        with:
          version: "latest" # or pin to an specific version, e.g. "v0.6.10"

      - name: Log Earthly version
        run: earthly --version

      - name: Authenticate to GitHub Container Registry
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.GH_CR_PAT != null }}
        env:
          GH_CR_PAT: ${{ secrets.GH_CR_PAT }}
        run: echo "${{ secrets.GH_CR_PAT }}" | docker login https://ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Check out pull request code
        uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Check out repository code
        uses: actions/checkout@v7
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          # Fetch all branches so the nightly build can check out the branch
          # named in EARTHLY_BUILD_BRANCH below.
          fetch-depth: 0

      - name: Build and push
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.GH_CR_PAT != null }}
        env:
          GH_CR_PAT: ${{ secrets.GH_CR_PAT }}
          EARTHLY_BUILD_TAG: "nightly"
          EARTHLY_PUSH: true
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: ./build/develop/container.sh

      - name: Build and publish standalone binaries
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET: ${{ secrets.S3_SECRET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          if [ -z "$S3_BUCKET" ] || [ -z "$S3_ENDPOINT" ]; then
            echo "No S3 storage configured; skipping standalone binary publish."
            exit 0
          fi
          VERSION="$(date +%Y%m%d)-nightly"
          # No --ci here: it implies --no-output, which would suppress the
          # SAVE ... AS LOCAL zips in dist/.
          earthly -P +package-all --version="$VERSION"

          zips=(dist/*.zip)
          if [ ! -e "${zips[0]}" ]; then
            echo "Earthly produced no zips in dist/; refusing to publish."
            exit 1
          fi

          export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$S3_SECRET"
          export AWS_DEFAULT_REGION="${S3_REGION:-us-east-1}"
          PREFIX="nightly"
          # Stable keys (owncast-nightly-<arch>.zip) and index.html are overwritten
          # in place below, so no wipe is needed. Only sweep legacy date-stamped
          # zips (owncast-<date>-nightly-*) left over from the old naming scheme;
          # the include pattern never matches the stable keys, so links never 403.
          aws s3 rm "s3://$S3_BUCKET/$PREFIX/" --recursive \
            --exclude "*" --include "owncast-2*-nightly-*" \
            --endpoint-url "$S3_ENDPOINT" --quiet || true

          # Owncast-built ffmpeg binaries from the latest ffmpeg-builds release.
          # Best effort: if the API call fails the section just lists nothing
          # beyond the link to the releases page.
          FFMPEG_ASSETS=$(curl -fsSL https://api.github.com/repos/owncast/ffmpeg-builds/releases/latest \
            | jq -r '.assets[] | "<li><a href=\"\(.browser_download_url)\">\(.name)</a> (\(.size / 1048576 | floor) MB)</li>"' || true)
          {
            printf '%s\n' \
              '<!doctype html>' \
              '<html lang="en">' \
              '<head><meta charset="utf-8"><title>Owncast nightly builds</title></head>' \
              '<body>' \
              '<h1>Owncast nightly builds</h1>' \
              "<p>Version $VERSION, built $(date -u +'%Y-%m-%d %H:%M UTC') from commit" \
              "<a href=\"https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA\">${GITHUB_SHA:0:7}</a>.</p>" \
              '<ul>'
            for f in dist/*.zip; do
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              # Link to a stable, un-dated key (e.g. owncast-nightly-linux-64bit.zip)
              # that always points at the latest build. The dated filenames are wiped
              # and re-created every night, so any consumer that caches this page
              # (e.g. the docs site's fetch-nightly-builds.js) would otherwise link to
              # objects that no longer exist and get a 403 AccessDenied.
              stable="owncast-nightly-${name#owncast-$VERSION-}"
              printf '<li><a href="%s/%s/%s/%s">%s</a> (%s)</li>\n' \
                "$S3_ENDPOINT" "$S3_BUCKET" "$PREFIX" "$stable" "$name" "$size"
            done
            printf '%s\n' \
              '</ul>' \
              '<p>Also available as a Docker image:' \
              '<a href="https://github.com/owncast/owncast/pkgs/container/owncast"><code>ghcr.io/owncast/owncast:nightly</code></a></p>' \
              '<h2>ffmpeg</h2>' \
              '<p>Owncast-built <a href="https://github.com/owncast/ffmpeg-builds/releases/latest">ffmpeg binaries</a>:</p>' \
              '<ul>'
            printf '%s\n' "$FFMPEG_ASSETS"
            printf '%s\n' \
              '</ul>' \
              '</body></html>'
          } > dist/index.html

          for f in dist/*.zip; do
            name=$(basename "$f")
            stable="owncast-nightly-${name#owncast-$VERSION-}"
            # Stable key for a durable URL; Content-Disposition preserves the dated
            # filename when the browser saves the download.
            aws s3 cp "$f" "s3://$S3_BUCKET/$PREFIX/$stable" --endpoint-url "$S3_ENDPOINT" \
              --acl public-read --content-type application/zip \
              --content-disposition "attachment; filename=$name" --no-progress
          done
          aws s3 cp dist/index.html "s3://$S3_BUCKET/$PREFIX/index.html" --endpoint-url "$S3_ENDPOINT" \
            --acl public-read --content-type text/html --no-progress
          echo "Published binaries: $S3_ENDPOINT/$S3_BUCKET/$PREFIX/index.html"

  # Manual, fork-friendly build of a linux/riscv64 container image.
  #
  # The Earthly job above cross-compiles with musl toolchains and pushes to
  # ghcr.io/owncast using the GH_CR_PAT secret, neither of which is available
  # from a fork. This job instead reuses the convenience Dockerfile, builds
  # natively for linux/riscv64 under QEMU, and pushes to ghcr.io/<owner>/owncast
  # with the workflow's own GITHUB_TOKEN.
  #
  # CGO is required for the SQLite driver, so the Go binary is compiled inside
  # an emulated riscv64 Alpine image. A cold build is slow; the Buildx GitHub
  # Actions cache makes repeat builds much faster.
  riscv64:
    name: linux/riscv64 container
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: riscv64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        run: |
          # GHCR requires a lowercase repository path.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(date +%Y%m%d)-riscv64" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/riscv64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/riscv64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:riscv64
            ${{ steps.meta.outputs.image }}:riscv64-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            NAME=linux-riscv64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published manifest
        run: docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:riscv64"
